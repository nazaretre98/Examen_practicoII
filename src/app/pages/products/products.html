<h1 class="titulo">Nuestros productos</h1>

<div class="buscador-container">
  <input
    type="text"
    placeholder="Buscar productos..."
    [(ngModel)]="terminoBusqueda"
    class="buscador-input"
    aria-label="Buscar productos"
  />
</div>

<div class="hero-banner">
  <img src="/img/STYLIZED-BOTF-FULL-MINI-LUMINIZER-GROUP.jpg.webp" alt="Banner de productos" class="banner" />
</div>

<section class="productos">
  <article class="producto" *ngFor="let producto of productosFiltrados; trackBy: trackById">
    <img [src]="producto.imagen" [alt]="producto.nombre" class="producto-imagen" />
    
    <h3 class="producto-nombre">{{ producto.nombre }}</h3>
    <p class="producto-descripcion">{{ producto.descripcion }}</p>

    <button class="boton-detalles" (click)="toggleMostrarMas(producto)">
      {{ producto.mostrarMas ? 'Ver menos' : 'Ver más' }}
    </button>

    <button class="boton-agregar" (click)="addToCart(producto)">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 18c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2zm10 0c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2zm-11.21-2l1.32-6h8.88l1.34 6H5.79zM20 4H6.21l-1.42-2H1v2h3l3.6 7.59-1.35 2.45A1 1 0 006 15h12v-2H7.42l.75-1.36H19a1 1 0 00.96-.74L21 6a1 1 0 00-1-1z"/>
      </svg>
      Añadir al carrito
    </button>

    <button class="boton-favorito" (click)="toggleFavorito(producto)">
      {{ producto.favorito ? '❤️ Favorito' : '♡ Añadir a favoritos' }}
    </button>

    <button class="boton-comprar" (click)="comprarAhora(producto)">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 18c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2zm10 0c-1.104 0-2 .896-2 2s.896 2 2 2 2-.896 2-2-.896-2-2-2zm-11.21-2l1.32-6h8.88l1.34 6H5.79zM20 4H6.21l-1.42-2H1v2h3l3.6 7.59-1.35 2.45A1 1 0 006 15h12v-2H7.42l.75-1.36H19a1 1 0 00.96-.74L21 6a1 1 0 00-1-1z"/>
      </svg>
      Comprar ahora
    </button>

    <div class="producto-detalles" *ngIf="producto.mostrarMas">
      <p>{{ producto.detalles }}</p>
    </div>
  </article>
</section>
